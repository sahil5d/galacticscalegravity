<html>

<head>
    <!-- Note: The 3D render is of mass, not surfacebrightness -->
    <title>Galaxy mass voxels estimate</title>

    <style>
        body {
            margin: 0;
            font-family: monospace;
            font-size: 10px;

            /* background-color: #050505; */
            background-color: #000000;
            color: #fff;
        }

        #thescene {}

        canvas,
        canvas:focus {
            outline: none;
            border: none;
        }
    </style>
    <link rel="stylesheet" href="./hud.css">
    <script src="./analytics.js"></script>
</head>

<body>
    <div id="thescene"></div>

    <div id="theinfo">
        <b>Galaxy Mass Voxels Estimate</b>
    </div>

    <nav class="header-nav" id="top-nav">
        <a class="nav-pill active" id="nav-viewer" href="./index.html">Mass Voxels</a>
        <a class="nav-pill" id="nav-dash1" href="./dashboard1.html">D1: Classic</a>
        <a class="nav-pill" id="nav-dash2" href="./dashboard2.html">D2: Formulas 1–5</a>
        <a class="nav-pill" id="nav-dash3" href="./dashboard3.html">D3: a-Term</a>
    </nav>

    <div id="hud-mode-bar">
        <button class="hud-mode-btn active" data-mode="all" onclick="set_hud_mode('all')">All (Dsk+Blg+Gas)</button>
        <button class="hud-mode-btn" data-mode="dsk" onclick="set_hud_mode('dsk')">Disk</button>
        <button class="hud-mode-btn" data-mode="blg" onclick="set_hud_mode('blg')">Bulge</button>
        <button class="hud-mode-btn" data-mode="gas" onclick="set_hud_mode('gas')">Gas</button>
    </div>
    <div id="density-scale-bar">
        <button class="density-scale-btn active" data-scale="common" onclick="set_density_scale('common')">Common
            &rho; White Scale</button>
        <button class="density-scale-btn" data-scale="separate" onclick="set_density_scale('separate')">Separate
            &rho; White Scale</button>
    </div>
    <canvas id="accel-hud" width="340" height="220"></canvas>
    <canvas id="sb-hud" width="340" height="220"></canvas>
    <div id="hud-controls">
        <div class="hud-controls-row">
            <button id="gal-prev-btn" type="button" title="Previous galaxy [">&lsaquo;</button>
            <select id="gal-select" title="Select SPARC galaxy"></select>
            <button id="gal-next-btn" type="button" title="Next galaxy ]">&rsaquo;</button>
            <button id="gal-random-btn" type="button" title="Load a random galaxy">Random</button>
            <button id="gal-rotate-btn" class="active" type="button" title="Toggle camera auto-rotation">Rotate: ON</button>
        </div>
        <span class="hud-controls-hint">Drag: rotate &middot; Scroll: zoom &middot; [ ]: prev/next</span>
    </div>

    <script src="./js_three.min.js"></script>
    <script src="./js_threeorbitcontrols.js"></script>

    <script src="./lib.js"></script>

    <script src="./data_sparcgalaxies.js"></script>
    <!-- <script src="./data_bestgalaxies.js"></script> -->

    <script src="./hud.js"></script>
    <script src="./logic.js"></script>
    <script src="./logic_dsk.js"></script>
    <script src="./logic_blg.js"></script>
    <script src="./logic_gas.js"></script>
    <!-- <script src="./logic_grav.js"></script> -->

    <!-- SCENE SETUP -->
    <script>
        var scene;
        var camera;
        var renderer;
        var controls;

        function setup() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(
                10,
                window.innerWidth / window.innerHeight,
                0.1,
                1000,
                // 0.1 * 10 ** -11,
                // 1000 * 10 ** -11
            );

            // camera.position.set(0, 0, 6 * BOHR_X);
            // camera.position.set(25, 25, 25);
            // camera.position.set(0, 0, 25);
            camera.position.set(0, 0, 1200);
            camera.lookAt(new THREE.Vector3(0, 0, 0));

            camera.far *= 10;
            camera.near *= 10;
            camera.updateProjectionMatrix();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optional

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.1;
            controls.update();

            document.querySelector("#thescene").appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        setup();
    </script>

    <!-- RUN VIZ -->
    <script>
        function run_post() {
            controls.update();
            requestAnimationFrame(run_post);
            renderer.render(scene, camera);
        }

        function update_nav_links(name) {
            var q = '?gal=' + encodeURIComponent(name);
            var v = document.getElementById('nav-viewer');
            var d1 = document.getElementById('nav-dash1');
            var d2 = document.getElementById('nav-dash2');
            var d3 = document.getElementById('nav-dash3');
            if (v) v.href = './index.html' + q;
            if (d1) d1.href = './dashboard1.html' + q;
            if (d2) d2.href = './dashboard2.html' + q;
            if (d3) d3.href = './dashboard3.html' + q;
            if (window.history && window.history.replaceState) {
                window.history.replaceState(null, '', q);
            }
        }

        function switch_galaxy(name) {
            if (!name || !galaxiesobj[name]) return;
            while (scene.children.length > 0) {
                var obj = scene.children[0];
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) obj.material.dispose();
            }
            thegal = name;
            var g = galaxiesobj[thegal];
            g.octant_col_sums = null;
            g.rho_common_peak = 0;
            g.mesh_dsk = null;
            g.mesh_blg = null;
            g.mesh_gas = null;

            if (galSelect) galSelect.value = thegal;
            update_nav_links(thegal);

            logic_dsk();
            logic_blg();
            logic_gas();
            calc_diff_tot();
            set_density_scale(density_scale_mode);
            set_hud_mode(hud_mode);
        }

        function step_galaxy(delta) {
            var idx = galaxieslist.indexOf(thegal);
            switch_galaxy(galaxieslist[(idx + delta + galaxieslist.length) % galaxieslist.length]);
        }

        var galSelect = document.getElementById('gal-select');
        if (galSelect && typeof galaxieslist !== 'undefined') {
            for (var gi = 0; gi < galaxieslist.length; gi++) {
                var opt = document.createElement('option');
                opt.value = galaxieslist[gi];
                opt.textContent = galaxieslist[gi];
                galSelect.appendChild(opt);
            }
            galSelect.addEventListener('change', function () {
                switch_galaxy(this.value);
            });
        }
        var galPrevBtn = document.getElementById('gal-prev-btn');
        if (galPrevBtn && typeof galaxieslist !== 'undefined') {
            galPrevBtn.addEventListener('click', function () { step_galaxy(-1); });
        }
        var galNextBtn = document.getElementById('gal-next-btn');
        if (galNextBtn && typeof galaxieslist !== 'undefined') {
            galNextBtn.addEventListener('click', function () { step_galaxy(1); });
        }
        var galRandomBtn = document.getElementById('gal-random-btn');
        if (galRandomBtn && typeof galaxieslist !== 'undefined') {
            galRandomBtn.addEventListener('click', function () {
                switch_galaxy(galaxieslist[Math.floor(Math.random() * galaxieslist.length)]);
            });
        }
        var galRotateBtn = document.getElementById('gal-rotate-btn');
        if (galRotateBtn) {
            galRotateBtn.addEventListener('click', function () {
                controls.autoRotate = !controls.autoRotate;
                this.textContent = controls.autoRotate ? 'Rotate: ON' : 'Rotate: OFF';
                this.classList.toggle('active', controls.autoRotate);
            });
        }
        window.addEventListener('keydown', function (e) {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
            if (e.key === '[') step_galaxy(-1);
            else if (e.key === ']') step_galaxy(1);
        });

        switch_galaxy(thegal);

        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.1;
        run_post();
    </script>

</body>

</html>
